<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="dicomweb-root" content="{{DICOMWEB_ROOT}}">
  <meta name="wado-root" content="{{WADO_ROOT}}">
  <title>Fortitude Explorer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f6fde'/%3E%3Cpath d='M10 8h13v4h-9v4h8v4h-8v6h-4z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script>
    // Theme before the first paint: the viewer's choice (app.js), else the system's.
    (function () {
      var theme = null;
      try { theme = localStorage.getItem("fortitude-theme"); } catch (e) {}
      if (theme !== "light" && theme !== "dark") {
        theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.dataset.theme = theme;
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">
      <span class="logo" aria-hidden="true">F</span>
      <span>Fortitude <span class="muted">Explorer</span></span>
    </a>
    <nav class="topnav">
      <a href="#/">Search</a>
      <a href="#/modalities">Modalities</a>
      <a href="#/upload">Upload</a>
    </nav>
    <div id="stats" class="stats" aria-live="polite"></div>
    <button id="theme" class="ghost theme-toggle" type="button">
      <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>
  <nav id="crumbs" class="crumbs" aria-label="Breadcrumb"></nav>
  <main id="view"></main>
  <script src="app.js"></script>
</body>
</html>
