# cargo-about (`cargo install cargo-about --locked --features cli`): the licenses of the crates built into the
# fortitude binary, written to THIRD-PARTY-NOTICES.txt with about.hbs:
#
#   cargo about generate --locked --fail -m crates/fortitude/Cargo.toml about.hbs -o THIRD-PARTY-NOTICES.txt
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "IJG",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "0BSD",
]
# The platforms of the Docker image
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Fortitude's own crates (publish = false)
private = { ignore = true }

# charls-sys builds CharLS, a C++ library under the BSD 3-Clause license (charls/LICENSE.md), into the binary: the
# license of the crate only covers its bindings (MIT)
[charls-sys.clarify]
license = "MIT AND BSD-3-Clause"

[[charls-sys.clarify.files]]
path = "LICENSE.md"
license = "MIT"
checksum = "b2c06a33544de153d64c76ad9f2cb69c61224815aecde5fe4bc4de676595e2a5"

[[charls-sys.clarify.files]]
path = "charls/LICENSE.md"
license = "BSD-3-Clause"
checksum = "e293ccc327ee42f4e723e73aac39b23ffc40655cc6f8baec5c046f2e7d093695"
