[workspace]
resolver = "3"
members = ["crates/*", "bench/fortitude-bench"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "AGPL-3.0-only"
repository = "https://github.com/alambec/fortitude"
publish = false

[workspace.dependencies]
fortitude-core = { path = "crates/fortitude-core" }
fortitude-store = { path = "crates/fortitude-store" }
fortitude-dicomweb = { path = "crates/fortitude-dicomweb" }
fortitude-dimse = { path = "crates/fortitude-dimse" }
fortitude-testkit = { path = "crates/fortitude-testkit" }

anyhow = "1.0.104"
async-stream = "0.3.6"
axum = "0.8.9"
base64 = "0.23.1"
bytes = "1.12.1"
# JPEG-LS codec of dicom-pixeldata, linked statically (CharLS is built from source with CMake).
charls = { version = "0.4.2", features = ["static"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
crc32fast = "1.5.3"
dicom-core = "0.10.1"
dicom-dictionary-std = "0.10.1"
dicom-encoding = "0.10.1"
dicom-json = "0.10.1"
dicom-object = "0.10.1"
dicom-parser = "0.10.1"
dicom-pixeldata = { version = "0.10.1", default-features = false, features = ["charls", "image", "native", "openjp2", "rayon"] }
dicom-transfer-syntax-registry = "0.10.1"
dicom-ul = { version = "0.10.1", features = ["async"] }
form_urlencoded = "1.2.2"
figment = { version = "0.10.19", features = ["toml", "env"] }
futures = "0.3.34"
hdrhistogram = "7.6.0"
humantime = "2.3.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
jpeg-encoder = { version = "0.7.1", features = ["simd"] }
memchr = "2.8.3"
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
object_store = { version = "0.14.2", default-features = false, features = ["aws"] }
rayon = "1.12.0"
postgres = "0.19.14"
rusqlite = { version = "0.41.1", features = ["bundled"] }
reqwest = { version = "0.13.5", default-features = false, features = ["stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
subtle = "2.6.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.29.0", features = ["v4"] }
walkdir = "2.5.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

# The bench tool rewrites many DICOM files; keep dev builds of dicom-rs usable.
[profile.dev.package."*"]
opt-level = 2
