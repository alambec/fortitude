name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: fortitude
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      # Pinned to the workspace rust-version, so that new lints land deliberately.
      - uses: dtolnay/rust-toolchain@1.92
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Tests with the PostgreSQL index
        run: cargo test --workspace
        env:
          TEST_POSTGRES_URL: host=localhost user=postgres password=test dbname=fortitude
      # A service container cannot be given the gateway's arguments.
      - name: Tests with S3 file storage
        run: |
          docker run -d --name s3 -p 7070:7070 -e ROOT_ACCESS_KEY=test -e ROOT_SECRET_KEY=test-secret \
            --tmpfs /data versity/versitygw:v1.10.0 posix /data
          until curl -sf --aws-sigv4 aws:amz:us-east-1:s3 --user test:test-secret \
            -X PUT http://localhost:7070/fortitude -o /dev/null; do sleep 1; done
          cargo test --workspace
        env:
          TEST_S3_URL: http://test:test-secret@localhost:7070/fortitude

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t fortitude:ci .
      - name: Smoke test
        run: |
          docker run -d --name fortitude -p 8042:8042 fortitude:ci
          for i in $(seq 30); do curl -sf localhost:8042/health && break; sleep 1; done
          curl -sf -H 'Accept: application/dicom+json' localhost:8042/dicom-web/studies
          curl -sf localhost:8042/metrics | grep -q fortitude_http_requests_total
          curl -sf localhost:8042/ui/ | grep -q dicomweb-root
          docker rm -f fortitude
