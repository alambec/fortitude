name: Release

# Builds the server image and pushes it to ghcr.io/alambec/fortitude on a version tag.
# Run by hand to (re)build an existing tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to build (e.g. v0.1.0)
        required: true

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          # The checked-out tag, not the commit the workflow runs from (run by hand: main).
          context: git
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          # 0.1.0 and 0.1; latest only for a release (no pre-release suffix such as -rc.1).
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest,enable=${{ !contains(env.TAG, '-') }}
          labels: |
            org.opencontainers.image.title=Fortitude
            org.opencontainers.image.description=DICOM server: DICOMweb and DIMSE
            org.opencontainers.image.vendor=Alambec
            org.opencontainers.image.licenses=AGPL-3.0-only
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
